<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background-color:#09090b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#09090b;">
      <tr>
        <td align="center" style="padding:48px 16px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td align="center" style="padding-bottom:24px;font-size:20px;font-weight:700;color:#fafafa;">
                AgentWe <span style="color:#c8ff00;">AI</span>
              </td>
            </tr>
            <tr>
              <td style="background-color:#18181b;border:1px solid #27272a;border-radius:16px;padding:32px;">
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#fafafa;">Confirm your email</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#a1a1aa;">
                  Thanks for signing up. Confirm {{ .Email }} to activate your account and start building.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background-color:#c8ff00;border-radius:8px;">
                      <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:12px 24px;font-size:15px;font-weight:600;color:#09090b;text-decoration:none;">Confirm email</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#71717a;">
                  If you didn't create an AgentWe account, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
